# Mobile-optimized KataGo GTP configuration for Android/iOS.
# Reduces memory usage and playout speed for mobile CPUs.
{
  "numSearchThreads": 2,
  "maxVisits": 400,
  "playDoubledVisits": false,
  "numVirtualLossesPerThread": 1,
  "mutexPoolSize": 64,
  "ponderingEnabled": true,
  "rootEndingBonus": 0.0,
  "subtreeValueBiasFactor": 0.35,
  "treeThreadPoolSizeMain": 2,
  "treeThreadPoolSizeAnalysis": 2,
  "searchFactorAfterOneUpdate": 1.0,
  "searchFactorRoot": 1.0,
  "fpuReductionMax": 0.15,
  "fpuReductionMin": 0.15,
  "valueFpuLossFactor": 0.0,
  "rootSymmetryPruning": true,
  "rootOptimisticTemperature": 0.0,
  "numSearchThreadsByPolicy": 2,
  "friendlyPassUsesNoVisits": false,
  "avoidPatternThreshold": 0.0,
  "avoidPatterns": [],
  "logSearchInfo": false,
  "logToStderr": false,
  "logToGtp": false,

  "nnMaxBatchSize": 4,
  "nnCacheSizePowerOfTwo": 18,
  "nnMutexPoolSize": 32,
  "nnRandomize": false,
  "nnRandSeed": 0,

  "supportedAnalysisParams": [
    "ownership",
    "scoreMean",
    "scoreStdev",
    "ownershipStdev"
  ],

  "analysisTimeLimit": 1.0,
  "analysisWideRootNoise": 0.04,
  "analysisWideRootNoiseVisits": 25,
  "analysisNumVisitorThreads": 2,
  "analysisPreferenceOwnership": true,
  "analysisWriteGoalToSgf": false,
  "reportAnalysisWinratesAs": "BLACK"

  # Performance tweaks for mobile CPUs
  # maxVisits: 400 vs desktop's 5000+ — keeps response time under 1s
  # numSearchThreads: 2 — respects mobile CPU core count
  # nnMaxBatchSize: 4 — small batch for low-power NN inference
  # nnCacheSizePowerOfTwo: 18 — ~256K entries, reasonable for mobile RAM
}