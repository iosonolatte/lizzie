# Even more conservative config for iOS with static library.
# iOS cannot use pthreads at full capacity and has thermal limits.
{
  "numSearchThreads": 1,
  "maxVisits": 300,
  "playDoubledVisits": false,
  "numVirtualLossesPerThread": 1,
  "mutexPoolSize": 32,
  "ponderingEnabled": true,
  "rootEndingBonus": 0.0,
  "subtreeValueBiasFactor": 0.35,
  "treeThreadPoolSizeMain": 1,
  "treeThreadPoolSizeAnalysis": 1,
  "searchFactorAfterOneUpdate": 1.0,
  "searchFactorRoot": 1.0,
  "fpuReductionMax": 0.15,
  "fpuReductionMin": 0.15,
  "valueFpuLossFactor": 0.0,
  "rootSymmetryPruning": true,
  "rootOptimisticTemperature": 0.0,
  "numSearchThreadsByPolicy": 1,
  "friendlyPassUsesNoVisits": false,
  "avoidPatternThreshold": 0.0,
  "avoidPatterns": [],
  "logSearchInfo": false,
  "logToStderr": false,
  "logToGtp": false,

  "nnMaxBatchSize": 2,
  "nnCacheSizePowerOfTwo": 17,
  "nnMutexPoolSize": 16,
  "nnRandomize": false,
  "nnRandSeed": 0,

  "supportedAnalysisParams": [
    "ownership",
    "scoreMean",
    "scoreStdev",
    "ownershipStdev"
  ],

  "analysisTimeLimit": 2.0,
  "analysisWideRootNoise": 0.04,
  "analysisWideRootNoiseVisits": 25,
  "analysisNumVisitorThreads": 1,
  "analysisPreferenceOwnership": true,
  "analysisWriteGoalToSgf": false,
  "reportAnalysisWinratesAs": "BLACK"

  # iOS thermal notes:
  # Single-threaded: avoids thermal throttling on A-series chips
  # maxVisits 300: fast enough for real-time feedback
  # nnMaxBatchSize 2: minimal memory pressure
}