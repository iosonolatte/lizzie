name: Build KataGo for Android

on:
  workflow_dispatch:
    inputs:
      katago_version:
        description: 'KataGo version tag (e.g., v1.15.0)'
        required: true
        default: 'v1.15.0'
      model_name:
        description: 'Network model name (e.g., kata1-b18c384nbt-s9996604416-d4316597426)'
        required: true
        default: 'kata1-b18c384nbt-s9996604416-d4316597426'
  push:
    paths:
      - 'katago-mobile/**'

permissions:
  contents: write

jobs:
  build-android:
    name: Build KataGo for Android (arm64-v8a)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lizzie-mobile/katago-mobile

    strategy:
      matrix:
        abi: [arm64-v8a]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: nttld/setup-android@v1
        with:
          # Cache SDK packages
          cache-enabled: true

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/tools/bin/sdkmanager --install "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build

      - name: Clone KataGo source
        run: bash scripts/clone-katago.sh ${{ github.event.inputs.katago_version || 'v1.15.0' }}

      - name: Fetch Eigen
        run: |
          if [ ! -d eigen ]; then
            git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git eigen
          fi

      - name: Build KataGo for ${{ matrix.abi }}
        run: |
          ABI="${{ matrix.abi }}"
          BUILD_DIR="out/android/build/$ABI"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"

          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-26 \
            -DUSE_CUDA=OFF \
            -DUSE_OPENCL=OFF \
            -DUSE_TENSORRT=OFF \
            -DUSE_BACKEND=EIGEN \
            -DEigen3_DIR="$GITHUB_WORKSPACE/lizzie-mobile/katago-mobile/eigen" \
            -DUSE_GLOG=OFF \
            -DUSE_AVX2=OFF \
            -DUSE_AVX512=OFF \
            -DUSE_NEON=ON \
            "$GITHUB_WORKSPACE/lizzie-mobile/katago-mobile/src"

          ninja katago

          # Copy binary to output
          mkdir -p "$GITHUB_WORKSPACE/lizzie-mobile/katago-mobile/out/android/$ABI"
          cp katago "$GITHUB_WORKSPACE/lizzie-mobile/katago-mobile/out/android/$ABI/"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: katago-android-${{ matrix.abi }}
          path: lizzie-mobile/katago-mobile/out/android/${{ matrix.abi }}/katago
          compression-level: 0

      - name: Upload config artifact
        uses: actions/upload-artifact@v4
        with:
          name: katago-android-config
          path: lizzie-mobile/katago-mobile/configs/android-gtp.cfg

  download-model:
    name: Download model
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lizzie-mobile/katago-mobile

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download model
        run: |
          MODEL_NAME="${{ github.event.inputs.model_name || 'kata1-b18c384nbt-s9996604416-d4316597426' }}"
          bash scripts/download-model.sh "$MODEL_NAME"

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: katago-mobile-model
          path: lizzie-mobile/katago-mobile/models/

      - name: Prepare assets for APK
        run: |
          mkdir -p composeApp/src/main/assets/katago/configs
          mkdir -p composeApp/src/main/assets/katago/models
          # Config
          cp configs/android-gtp.cfg composeApp/src/main/assets/katago/configs/gtp.cfg
          # Binary will be placed here after build
          mkdir -p composeApp/src/main/assets/katago/arm64-v8a

      - name: Upload APK assets
        uses: actions/upload-artifact@v4
        with:
          name: katago-apk-assets
          path: lizzie-mobile/composeApp/src/main/assets/katago/