name: Build KataGo for Android

on:
  workflow_dispatch:
    inputs:
      katago_version:
        description: 'KataGo version tag (e.g., v1.15.0)'
        required: true
        default: 'v1.15.0'
      model_name:
        description: 'Network model name'
        required: true
        default: 'kata1-b18c384nbt-s9996604416-d4316597426'

permissions:
  contents: read

jobs:
  build-android:
    name: Build KataGo for Android (arm64-v8a)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lizzie-mobile/katago-mobile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-port-kmp
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build wget unzip libeigen3-dev

      - name: Setup Android SDK + NDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platforms;android-26" "ndk;27.0.12077973" "build-tools;35.0.0" 2>&1 | tail -5
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Clone KataGo
        run: bash scripts/clone-katago.sh ${{ github.event.inputs.katago_version || 'v1.15.0' }}

      - name: Build KataGo for Android
        run: |
          bash scripts/build-android.sh 2>&1 | tee ../build-android.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-android-log
          path: lizzie-mobile/build-android.log

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: katago-android-arm64-v8a
          path: lizzie-mobile/katago-mobile/out/android/arm64-v8a/katago
          compression-level: 0

      - name: Upload config
        uses: actions/upload-artifact@v4
        with:
          name: katago-android-config
          path: lizzie-mobile/katago-mobile/configs/android-gtp.cfg

  download-model:
    name: Download model
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lizzie-mobile/katago-mobile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-port-kmp
          fetch-depth: 1

      - name: Download model
        run: |
          MODEL_NAME="${{ github.event.inputs.model_name || 'kata1-b18c384nbt-s9996604416-d4316597426' }}"
          bash scripts/download-model.sh "$MODEL_NAME"

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: katago-mobile-model
          path: lizzie-mobile/katago-mobile/models/