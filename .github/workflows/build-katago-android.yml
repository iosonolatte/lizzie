name: Build KataGo for Android

on:
  workflow_dispatch:
    inputs:
      katago_version:
        description: 'KataGo version tag'
        required: true
        default: 'v1.15.0'
      model_name:
        description: 'Network model name'
        required: true
        default: 'kata1-b18c384nbt-s9996604416-d4316597426'

permissions:
  contents: read

jobs:
  build-android:
    name: Build KataGo for Android (arm64-v8a)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lizzie-mobile/katago-mobile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-port-kmp
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build wget unzip libeigen3-dev

      - name: Setup Android SDK + NDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platforms;android-26" "ndk;27.0.12077973" "build-tools;35.0.0" 2>&1 | tail -5
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Clone KataGo
        run: bash scripts/clone-katago.sh ${{ github.event.inputs.katago_version || 'v1.15.0' }}

      - name: Build KataGo for Android
        run: bash scripts/build-android.sh 2>&1 | tee ../build-android.log

      - name: Copy binary to assets
        run: |
          mkdir -p $GITHUB_WORKSPACE/assets/katago/arm64-v8a
          mkdir -p $GITHUB_WORKSPACE/assets/katago/configs
          cp out/android/arm64-v8a/katago $GITHUB_WORKSPACE/assets/katago/arm64-v8a/ 2>/dev/null || \
            cp out/android/build/arm64-v8a/katago $GITHUB_WORKSPACE/assets/katago/arm64-v8a/ 2>/dev/null || true
          cp configs/android-gtp.cfg $GITHUB_WORKSPACE/assets/katago/configs/gtp.cfg 2>/dev/null || true

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: katago-android-assets
          path: assets/

  download-model:
    name: Download model
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lizzie-mobile/katago-mobile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-port-kmp
          fetch-depth: 1

      - name: Download model
        run: |
          MODEL_NAME="${{ github.event.inputs.model_name || 'kata1-b18c384nbt-s9996604416-d4316597426' }}"
          bash scripts/download-model.sh "$MODEL_NAME"

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: katago-mobile-model
          path: lizzie-mobile/katago-mobile/models/

  assemble-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [build-android, download-model]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-port-kmp
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download kataGo binary + config assets
        uses: actions/download-artifact@v4
        with:
          name: katago-android-assets
          path: katago-assets

      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: katago-mobile-model
          path: katago-model

      - name: Stage assets into app
        run: |
          mkdir -p lizzie-mobile/composeApp/src/main/assets/katago/arm64-v8a
          mkdir -p lizzie-mobile/composeApp/src/main/assets/katago/configs
          mkdir -p lizzie-mobile/composeApp/src/main/assets/katago/models
          cp katago-assets/katago/arm64-v8a/katago lizzie-mobile/composeApp/src/main/assets/katago/arm64-v8a/ 2>/dev/null || true
          cp katago-assets/katago/configs/gtp.cfg lizzie-mobile/composeApp/src/main/assets/katago/configs/ 2>/dev/null || true
          cp katago-model/kata1-*-*.bin.gz lizzie-mobile/composeApp/src/main/assets/katago/models/ 2>/dev/null || true
          echo "=== Staged assets ==="
          find lizzie-mobile/composeApp/src/main/assets -type f

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build Android APK
        run: |
          cd lizzie-mobile
          chmod +x gradlew 2>/dev/null || gradle wrapper
          ./gradlew :composeApp:assembleDebug --no-daemon 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lizzie-mobile-apk
          path: lizzie-mobile/composeApp/build/outputs/apk/debug/composeApp-debug.apk