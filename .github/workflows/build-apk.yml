name: Build Flutter APK

on:
  push:
    branches: [master, main, mobile-flutter]
  pull_request:
    branches: [master, main, mobile-flutter]
  workflow_dispatch:

jobs:
  build:
    name: Build & test Flutter app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        run: |
          set -e
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp
          # commandlinetools 12266719 = v16.0 (matches what Flutter 3.44 expects)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q commandlinetools-linux-12266719_latest.zip
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm commandlinetools-linux-12266719_latest.zip

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses 2>&1 | tail -3

      - name: Install SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" 2>&1 | tail -5

      - name: Show toolchain
        working-directory: lizzie_mobile
        run: |
          flutter --version
          flutter doctor

      - name: Install dependencies
        working-directory: lizzie_mobile
        run: flutter pub get

      - name: Check formatting
        working-directory: lizzie_mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: lizzie_mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: lizzie_mobile
        run: flutter test --reporter=expanded

      - name: Build debug APK
        working-directory: lizzie_mobile
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lizzie-mobile-apk
          path: lizzie_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
